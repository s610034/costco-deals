name: 好市多折扣週報 (發布健康檢查)

on:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # UTC 03:07 = 台灣時間 11:07，於每週一、三、五執行
    # （本機 launchd 09:15 開始跑，流程含多個 Playwright 頁面驗證步驟可能跑到 30-60 分鐘，這裡留緩衝；
    # 時間刻意避開整點，GitHub 官方說明整點是排程高負載時段，容易延遲或被跳過）
    - cron: "7 3 * * 1,3,5"
  workflow_dispatch:

permissions: {}

jobs:
  health-check:
    name: 檢查今日週報發布狀態
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      STATUS_URL: https://s610034.github.io/costco-deals/status.json
      MIN_ITEM_COUNT: "30"
      TG_BOT_TOKEN: ${{ secrets.COSTCO_TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.COSTCO_TG_CHAT_ID }}

    steps:
      - name: 檢查 status.json
        shell: bash
        run: |
          set -uo pipefail

          status_file="$(mktemp)"
          trap 'rm -f "$status_file"' EXIT

          reason=""

          # 加上時間戳並禁止快取，避免讀到 GitHub Pages/CDN 的舊資料
          request_url="${STATUS_URL}?health_check=$(date +%s)"

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 2 \
            --connect-timeout 10 \
            --max-time 30 \
            --header "Cache-Control: no-cache" \
            --output "$status_file" \
            "$request_url"; then
            reason="無法從 GitHub Pages 取得 status.json"
          fi

          generated_at=""
          item_count=""

          if [[ -z "$reason" ]]; then
            if ! jq -e 'type == "object"' "$status_file" >/dev/null 2>&1; then
              reason="status.json 不是有效的 JSON 物件"
            else
              generated_at="$(jq -r '.generated_at // empty' "$status_file")"
              item_count="$(jq -r '.item_count // empty' "$status_file")"

              if [[ -z "$generated_at" ]]; then
                reason="status.json 缺少 generated_at"
              elif ! jq -e '.generated_at | type == "string" and test("^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$")' "$status_file" >/dev/null 2>&1; then
                reason="generated_at 不是有效的 ISO 8601 時間：${generated_at}"
              elif ! generated_epoch="$(date --date="$generated_at" +%s 2>/dev/null)"; then
                reason="generated_at 無法解析成時間：${generated_at}"
              elif ! jq -e '.item_count | type == "number" and . == floor and . >= 0' "$status_file" >/dev/null 2>&1; then
                reason="status.json 的 item_count 不是非負整數：${item_count}"
              elif ! jq -e --argjson min "$MIN_ITEM_COUNT" '.item_count >= $min' "$status_file" >/dev/null 2>&1; then
                reason="今日報告只有 ${item_count} 筆商品，低於最低門檻 ${MIN_ITEM_COUNT} 筆"
              else
                # 台灣不實施夏令時間，固定用 UTC+8 換算，不依賴 runner 是否裝有 tzdata/
                # Asia/Taipei 時區資料庫（實測精簡版 ubuntu image 沒裝 tzdata 時，
                # `TZ=Asia/Taipei date` 會靜默失效、退化成 UTC，容易在日期邊界誤判）
                published_date="$(date -u --date="@$((generated_epoch + 8*3600))" +%F)"
                today="$(date -u --date="@$(($(date -u +%s) + 8*3600))" +%F)"

                if [[ "$published_date" != "$today" ]]; then
                  generated_taipei="$(date -u --date="@$((generated_epoch + 8*3600))" '+%Y-%m-%d %H:%M:%S')（台灣時間）"
                  reason="最新報告發布於 ${generated_taipei}，不是台灣時間今天（${today}）"
                fi
              fi
            fi
          fi

          if [[ -z "$reason" ]]; then
            generated_taipei="$(date -u --date="@$((generated_epoch + 8*3600))" '+%Y-%m-%d %H:%M:%S')（台灣時間）"
            echo "✅ 好市多折扣週報發布正常"
            echo "發布時間：${generated_taipei}"
            echo "商品數量：${item_count}"
            exit 0
          fi

          echo "::error::好市多折扣週報健康檢查失敗：${reason}"

          message="⚠️ 好市多折扣週報發布異常
          今天的本機排程似乎沒有成功完成。
          原因：${reason}
          請檢查執行排程的 Mac 是否有開機、是否進入睡眠，以及 launchd、網路或部署流程是否正常。
          檢查時間：$(date -u --date="@$(($(date -u +%s) + 8*3600))" '+%Y-%m-%d %H:%M:%S')（台灣時間）
          GitHub Actions：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          if [[ -z "$TG_BOT_TOKEN" || -z "$TG_CHAT_ID" ]]; then
            echo "::error::Telegram secrets 未設定，無法發送警告訊息"
            exit 1
          fi

          if ! curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" \
            --data-urlencode "text=${message}" \
            --data-urlencode "disable_web_page_preview=true" \
            >/dev/null; then
            echo "::error::Telegram 警告訊息發送失敗"
          else
            echo "Telegram 警告訊息已發送"
          fi

          exit 1
